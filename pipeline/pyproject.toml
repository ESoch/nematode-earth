[project]
name = "nematode-earth-pipeline"
version = "0.1.0"
description = "Offline data-extraction pipeline for the Nematode Earth visualization"
requires-python = ">=3.11"
dependencies = [
    "imagecodecs>=2026.3.6",
    "numpy>=1.26",
    "requests>=2.31",
    "tifffile>=2026.3.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# pytest's default `norecursedirs` includes a literal "build" pattern
# (assumed packaging output), which silently skips this project's
# `build/` module directory (per the design spec's `pipeline/build/`
# layout) during collection -- `uv run pytest` from `pipeline/` would
# report only fetch/'s tests with no error. Override with our own list
# so `build/` is collected; only actual noise directories are excluded.
norecursedirs = [".venv", "__pycache__", ".git", ".pytest_cache"]
