name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  exhibit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.0'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:release
      - run: pnpm build
        env:
          SITE_REVISION: ${{ github.sha }}
      - name: Save the verified Pages upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nematode-earth-${{ github.sha }}
          path: app/dist/
          if-no-files-found: error
          compression-level: 1
          retention-days: 14

  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.11.23'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --offline --no-sync pytest -q -rs

  deploy:
    name: Deploy and verify production
    needs: [exhibit, pipeline]
    if: github.repository == 'ESoch/nematode-earth' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://nematode.earth/
    concurrency:
      group: nematode-earth-production
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: app/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nematode-earth-${{ github.sha }}
          path: ${{ runner.temp }}/pages-site
      - name: Check the artifact and current main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -e --arg sha "$GITHUB_SHA" '.revision == $sha' "$RUNNER_TEMP/pages-site/release.json" >/dev/null
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "::error::This run was superseded by $main_sha on main. The upload was stopped."
            exit 1
          fi
      - name: Upload the verified site to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.166.0'
          command: pages deploy ${{ runner.temp }}/pages-site --project-name=nematode-earth --branch=main --commit-hash=${{ github.sha }}
      - name: Verify the live revision on nematode.earth
        run: |
          node app/scripts/verify-live-revision.mjs "$GITHUB_SHA"
          echo "Verified \`$GITHUB_SHA\` on [nematode.earth](https://nematode.earth/release.json)." >> "$GITHUB_STEP_SUMMARY"
